<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My 3D Portfolio</title>
    <link rel="stylesheet" href="./css/bundle.css" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preload" href="./assets/models/scene.glb" as="fetch" crossorigin />
  </head>
  <body>

  <div id="cameraToggle">
    <div class="toggle-container">
      <span class="toggle-label">Camera</span>
      <div class="toggle-switch" id="toggleSwitch">
        <div class="toggle-slider"></div>
      </div>
    </div>
  </div>

    <div id="chessWelcome">
      <h1>♟️ 3D Chess AI</h1>
      <p>Play against an AI trained on 791 features</p>
      <div class="chess-buttons">
        <button class="chess-btn primary" id="startChessBtn">
          ▶ Start Game
        </button>
      </div>
      <div class="ai-loading-container" id="aiLoadingText" style="display: none;">
  <div class="ai-loading-spinner">
    <div class="ai-loading-spinner-inner">♟️</div>
  </div>
  <p class="ai-loading-text">Loading Chess AI</p>
</div>
    </div>
    
    <!-- Promotion UI -->
    <div id="promotionUI">
      <h2 id="promotionTitle">Choose Your Piece</h2>
      <div class="promotion-pieces">
        <button class="promo-piece" data-piece="Q">♛</button>
        <button class="promo-piece" data-piece="R">♜</button>
        <button class="promo-piece" data-piece="B">♝</button>
        <button class="promo-piece" data-piece="N">♞</button>
      </div>
    </div>
    
    <!-- Status Display -->
    <div id="chessStatus">
      <h3>♟️ Chess Game</h3>
      <div class="status-item">
        <span class="status-label">Turn:</span>
        <span class="status-value" id="turnIndicator">White</span>
      </div>
      <div class="status-item">
        <span class="status-label">Moves:</span>
        <span class="status-value" id="moveCounter">0</span>
      </div>
    </div>
    
    <!-- Control Panel -->
    <div id="chessControls">
      <button class="chess-btn danger" id="resetBtn">🔄 Reset</button>
    </div>
    
    <!-- Move Indicator -->
    <div class="move-indicator" id="moveIndicator"></div>
    
    <!-- Game Over Screen -->
    <div id="gameOverScreen">
      <h2 id="gameOverTitle">Game Over!</h2>
      <p id="gameOverMessage">Checkmate!</p>
      <div class="chess-buttons">
        <button class="chess-btn primary" id="playAgainBtn">🔄 Play Again</button>
      </div>
    </div>

    <!-- Asset Loading System -->
    <script src="./js/AssetLoader.js"></script>
    <script src="./js/LoadingScreen.js"></script>

    <!-- html2canvas (Self-Hosted) -->
    <script src="./libs/html2canvas.min.js"></script>

    <!-- Import Map for Three.js -->
    <script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/examples/jsm/controls/OrbitControls.js": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js",
    "three/examples/jsm/loaders/GLTFLoader.js": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js",
    "three/examples/jsm/loaders/RGBELoader.js": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/RGBELoader.js"
  }
}
    </script>
    
    <!-- Load modules -->
    <script src="./js/chess-logic.js"></script>
    <script src="./js/chess-animations.js"></script>
    <script src="./js/chess-interactions.js"></script>
    <script src="./js/tv-screen.js"></script>
    <script src="./js/laptop-screen.js"></script>
    <script src="./js/AudioManager.js"></script>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
